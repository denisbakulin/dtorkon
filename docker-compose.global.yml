services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-https://denisbakulin.ru}
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN:-https://denisbakulin.ru}
      SQLITE_PATH: /data/blog.sqlite
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - sqlite-data:/data

  web:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    depends_on:
      - api
    env_file:
      - .env
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-denisbakulin.ru}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile.global
      - --adapter
      - caddyfile
    ports:
      - "${GLOBAL_HTTP_PORT:-80}:80"
      - "${GLOBAL_HTTPS_PORT:-443}:443"
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sqlite-data:
  caddy-data:
  caddy-config:
