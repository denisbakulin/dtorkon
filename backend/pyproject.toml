[tool.poetry]
name = "dtorkon-backend"
version = "0.1.0"
description = "FastAPI backend for the dtorkon mini-blog"
authors = ["dtorkon"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.116.1"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
sqlalchemy = "^2.0.43"
aiosqlite = "^0.21.0"
pydantic-settings = "^2.10.1"
boto3 = "^1.40.9"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
