services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PUBLIC_APP_ORIGIN: http://localhost:${LOCAL_HTTP_PORT:-8080}
      ADMIN_APP_ORIGIN: http://localhost:${LOCAL_HTTP_PORT:-8080}
      SQLITE_PATH: /data/blog.sqlite
      CADVISOR_BASE_URL: ${CADVISOR_BASE_URL:-http://cadvisor:8080}
      NODE_EXPORTER_BASE_URL: ${NODE_EXPORTER_BASE_URL:-http://node-exporter:9100}
      UPTIME_KUMA_BASE_URL: ${UPTIME_KUMA_BASE_URL:-}
      UPTIME_KUMA_STATUS_SLUG: ${UPTIME_KUMA_STATUS_SLUG:-}
      WATCHFILES_FORCE_POLLING: "true"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - sqlite-data:/data

  web:
    image: node:22-alpine
    depends_on:
      - api
    working_dir: /app/frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    command:
      - sh
      - -lc
      - |
        if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
          npm ci
        elif [ ! -f node_modules/.package-lock.json ]; then
          npm ci
        elif ! cmp -s package-lock.json node_modules/.package-lock.json; then
          npm ci
        fi
        npm run dev
    ports:
      - "${LOCAL_HTTP_PORT:-8080}:5173"
    restart: unless-stopped
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.53.0
    profiles:
      - monitoring
    privileged: true
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    profiles:
      - monitoring
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave

volumes:
  sqlite-data:
  frontend-node-modules:
