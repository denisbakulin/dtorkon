services:
  landing:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: dtorkon-landing
    env_file:
      - .env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      CERT_CHECK_INTERVAL: ${CERT_CHECK_INTERVAL:-21600}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - nginx-ssl:/etc/nginx/ssl

  certbot:
    image: certbot/certbot:latest
    container_name: dtorkon-certbot
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - /opt/certbot/ensure-certificate.sh
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./infra/certbot/ensure-certificate.sh:/opt/certbot/ensure-certificate.sh:ro

volumes:
  certbot-etc:
  certbot-webroot:
  nginx-ssl:
