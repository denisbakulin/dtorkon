services:
  landing:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    container_name: dtorkon-landing
    env_file:
      - .env
    environment:
      DOMAIN_NAMES: ${DOMAIN_NAMES:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
